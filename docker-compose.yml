name: nexusai

# NexusAI Phase 1: a runnable local foundation only — frontend, API, and Postgres+pgvector.
# No Kafka, Kubernetes, cloud services, or model downloads. Everything binds to 127.0.0.1 only.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexusai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexusai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-nexusai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexusai} -d ${POSTGRES_DB:-nexusai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: nexusai-api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: nexusai-frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  postgres-data:
