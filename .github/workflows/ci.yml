name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexusai
          POSTGRES_PASSWORD: nexusai-test-password
          POSTGRES_DB: nexusai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusai -d nexusai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXUSAI_TEST_POSTGRES_URL: postgresql://nexusai:nexusai-test-password@127.0.0.1:5432/nexusai_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-production.txt
      - run: pip install -r requirements-production.txt
        working-directory: backend
      - run: python -m unittest discover -s tests
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build api frontend
